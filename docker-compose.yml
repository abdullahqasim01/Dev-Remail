name: dev-remail

services:
  dev-remail:
    build: .
    image: dev-remail:latest
    ports:
      - "6245:6245"
    volumes:
      - dev-remail-data:/data
    environment:
      # Optional: public URL used in attachment/raw download links returned by the API.
      # PUBLIC_URL: http://localhost:6245
      # Optional: fixed webhook signing secret (otherwise generated on first start).
      # WEBHOOK_SECRET: whsec_...
      PORT: "6245"
    extra_hosts:
      # lets webhooks reach your app on the host (localhost is rewritten to this) on Linux too
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  dev-remail-data:
